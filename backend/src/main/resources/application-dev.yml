server:
  port: 8088

spring:
  application:
    name: smart-campus-backend

  datasource:
    url: jdbc:h2:mem:smart_campus_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  cache:
    type: simple

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expirationMs: 86400000

logging:
  level:
    com.smartcampus: INFO
